<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title description">
<title id="title">Integration release results</title>
<desc id="description">Release 0.4.0 has 180 passing pytest tests and 24 validated native language packs. Its device-parser fuzz campaign completed 9,823,752 executions with a 60-second mutation budget. Six published files including the manifest match the RC byte for byte. These counts do not measure code coverage or physical reliability.</desc>
